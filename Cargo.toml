[package]
name = "handl-lib-ip"
version = "0.1.0"
edition = "2024"
description = "ip: IP address, CIDR, and socket primitives (Handl stdlib port)."
license = "MIT"
repository = "https://github.com/handl-lang/lib-ip"
homepage = "https://github.com/handl-lang/lib-ip"
readme = "README.md"

[dependencies]
serde_json = "1"

# ADR-0128 §Resolution: platform comes from the sibling checkout for local
# development; CI resolves the git source.

[patch."https://github.com/handl-lang/lib-str-handl"]
handl-lib-str-handl = { path = "../lib-str-handl" }
